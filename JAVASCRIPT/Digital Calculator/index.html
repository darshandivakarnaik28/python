<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Digital Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <header><h1>Digital Calculator</h1></header>  
      <main>
        <form>
            <input type="display" id="readonly">
            <br>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <br>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <br>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
            <br>
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>/</button>

        </form>
      </main>
    </body>
